[profile.default]
src = "src"
out = "out"
libs = ["lib", "node_modules"]
solc = "0.8.28"
optimizer = true
optimizer_runs = 200
via_ir = true
evm_version = "cancun"
remappings = [
  "forge-std/=lib/forge-std/src/",
  "@openzeppelin/=node_modules/@openzeppelin/",
  "@pythnetwork/=node_modules/@pythnetwork/"
]
fs_permissions = [{ access = "read-write", path = "deployments" }]

[rpc_endpoints]
local = "http://127.0.0.1:8545"
bsc = "https://bsc-dataseed.bnbchain.org"
bsc_testnet = "https://bsc-testnet-dataseed.bnbchain.org"

[etherscan]
bsc = { key = "${BSCSCAN_API_KEY}", chain = 56 }
bsc_testnet = { key = "${BSCSCAN_API_KEY}", chain = 97 }

[fuzz]
runs = 512

[lint]
exclude_lints = ["unsafe-typecast", "mixed-case-variable", "screaming-snake-case-const"]

[invariant]
runs = 128
depth = 100
fail_on_revert = true
