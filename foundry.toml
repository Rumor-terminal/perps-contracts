[profile.default]
src = "src"
out = "out"
libs = ["lib", "node_modules"]
solc = "0.8.28"
optimizer = true
optimizer_runs = 200
via_ir = true
evm_version = "cancun"
remappings = [
  "forge-std/=lib/forge-std/src/",
  "@openzeppelin/=node_modules/@openzeppelin/",
  "@pythnetwork/=node_modules/@pythnetwork/"
]
fs_permissions = [{ access = "read-write", path = "../deployments" }]

[fuzz]
runs = 512

[lint]
exclude_lints = ["unsafe-typecast", "mixed-case-variable", "screaming-snake-case-const"]
